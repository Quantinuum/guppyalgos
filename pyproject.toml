[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "guppyalgos"
version = "0.1.0"
description = "Reusable primitives for composing abstract quantum algorithms in Guppy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Nathan Fitzpatrick", email = "nathan.fitzpatrick@quantinuum.com" },
]

dependencies = [
    "guppylang>=1.1",
    "pandas",
    "numpy",
    "scipy",
    "zixy>=0.3.1",
]


[tool.uv]
prerelease = "allow"

[project.optional-dependencies]
dev-dependencies = [
    "selene-sim>=0.2.17",
    "jupyter>=1.1.0",
    "matplotlib>=3.11.1",
    "pandas-stubs",
    "ipykernel>=7.3.0",
    "pytest-notebook>=0.11.0",
    "pytest>=9.0.3,<10",
    "pytest-lazy-fixtures",
    "sphinx==9.1.0",
    "pytest-xdist",
    "sphinx-math-dollar>=1.2.1",
    "sphinx-autodoc-typehints>=3.13.2",
    "furo>=2024.8.6",
    "myst-nb>=1.3.0",
    "ruff>=0.16.2",
    "ty==0.0.72",
    "prek",
    "quantinuum-sphinx>=1.11.2",
    "sphinx-copybutton",
    "sphinxcontrib-tikz>=0.4.20",
]
numba = ["numba>=0.6.7"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = ["guppyalgos", "guppyalgos.*"]

[project.urls]
Repository = "https://github.com/Quantinuum/guppyalgos"
Documentation = "https://github.com/Quantinuum/guppyalgos/tree/main/docs"
Issues = "https://github.com/Quantinuum/guppyalgos/issues"
Changelog = "https://github.com/Quantinuum/guppyalgos/blob/main/CHANGELOG.md"


[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
lint.select = ["E", "F", "B", "RUF", "PT", "UP", "C4", "D", "T10"]
lint.ignore = ["RUF002"]
extend-exclude = ["**/*.ipynb", "tests/conftest.py", ".venv/**", "docs/**"]
target-version = "py312"
[tool.lint.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/conftest.py" = ["D103"]

[tool.ty.src]
exclude = ["agents/**", "**/*.ipynb"]

[tool.ty.rules]
#For GuppyFunctionDefinition[[x],y] to be an allowed python type, as it uses guppy's internal type system which is not fully compatible with ty's
invalid-type-form = "ignore"
invalid-type-arguments = "ignore"
# GuppyFunctionDefinition call signatures are explicit Guppy-level types rather
# than Python-native callable signatures, so ty 0.0.41 reports broad false
# positives for higher-order argument, default, and return compatibility.
invalid-argument-type = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
