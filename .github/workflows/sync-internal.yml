name: Sync internal branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-internal
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Quantinuum/guppyalgos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Always sync current main, including when retrying an older run.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Sync files and selected CI as NathanCQC
        env:
          FORK_ACCESS_TOKEN: ${{ secrets.FORK_ACCESS_TOKEN }}
          INTERNAL_REPOSITORY: ${{ vars.INTERNAL_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FORK_ACCESS_TOKEN:?Set the FORK_ACCESS_TOKEN repository secret}"
          : "${INTERNAL_REPOSITORY:?Set the INTERNAL_REPOSITORY repository variable}"
          git config user.name NathanCQC
          git config user.email nathan.fitzpatrick@quantinuum.com
          git remote add internal \
            "https://NathanCQC:${FORK_ACCESS_TOKEN}@github.com/${INTERNAL_REPOSITORY}.git"

          git checkout -B sync-source origin/main
          find .github/workflows -type f ! -name ci.yml \
            ! -name test-folder.yml \
            ! -name pr-title.yml -delete
          git rm -rf --ignore-unmatch guppyalgos.internal
          sed -i \
            -e 's/branches: \[main\]/branches: [main-internal]/' \
            -e "s#refs/heads/main'#refs/heads/main-internal'#g" \
            .github/workflows/ci.yml
          git add -A
          git commit -m "chore: prepare internal sync" || true

          if git fetch internal main-internal; then
            git checkout -B main-internal FETCH_HEAD
            git rm -rf --ignore-unmatch .
            git checkout sync-source -- .
            if git cat-file -e FETCH_HEAD:guppyalgos.internal 2>/dev/null; then
              git checkout FETCH_HEAD -- guppyalgos.internal
            fi
            git add -A
            git commit -m "chore: sync public main ($(git rev-parse --short origin/main))" || true
          else
            git checkout -B main-internal sync-source
          fi

          git push internal main-internal:main-internal
