name: Build wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-wheels-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build_wheels:
    # Run after Release Please publishes a release, or against a tag selected by
    # a maintainer for a rehearsal or retry. Ordinary commits use ci.yml instead.
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
      - name: Validate the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          manifest = json.loads(Path(".release-please-manifest.json").read_text())
          if project["name"] != "guppyalgos":
              raise SystemExit("Unexpected package name")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) or version == "0.0.0":
              raise SystemExit("Expected a stable release version above 0.0.0")
          if os.environ["RELEASE_TAG"] != f"v{version}" or manifest["."] != version:
              raise SystemExit("Release tag, package version, and manifest must match")
          PY
      - name: Build and validate guppyalgos distributions
        run: |
          uv lock --check
          uv build --out-dir wheelhouse
          uvx twine check --strict wheelhouse/*
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("wheelhouse").glob("guppyalgos-*.whl"))
          sources = list(Path("wheelhouse").glob("guppyalgos-*.tar.gz"))
          if len(wheels) != 1 or not wheels[0].name.endswith("-py3-none-any.whl"):
              raise SystemExit("Expected one universal guppyalgos wheel")
          if len(sources) != 1:
              raise SystemExit("Expected one guppyalgos source distribution")
          PY
      # guppyalgos is pure Python: uv build creates a py3-none-any wheel. One
      # Ubuntu build avoids five identical distributions; ci.yml tests the
      # supported Python versions independently.
      - name: Smoke-test the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_test_package.py"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: |
            wheelhouse/guppyalgos-*.whl
            wheelhouse/guppyalgos-*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  release:
    name: Release wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.repository.private }}
    needs: [build_wheels]
    # Configure required reviewers and allow version tags in this environment.
    environment:
      name: pypi
      url: https://pypi.org/p/guppyalgos
    permissions:
      contents: write
      id-token: write
    steps:
      # Download the exact validated artifacts from the preceding build job.
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: wheelhouse
      - name: Update GitHub release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            wheelhouse/guppyalgos-*.whl
            wheelhouse/guppyalgos-*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: false
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          attestations: true
          verbose: true
          skip-existing: true
