name: Test batch

on:
  workflow_call:
    inputs:
      test-paths:
        description: JSON list of test files assigned to this batch
        required: true
        type: string
      batch:
        required: true
        type: number
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ inputs.python-version }} / batch ${{ inputs.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_LOCKED: "1"
      TEST_PATHS: ${{ inputs.test-paths }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.3"
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run assigned tests
        run: |
          uv run python - <<'PY'
          import json
          import os

          import pytest

          paths = json.loads(os.environ["TEST_PATHS"])
          if not isinstance(paths, list) or not paths or not all(isinstance(p, str) for p in paths):
              raise SystemExit("Expected a nonempty JSON list of test paths")
          print("Assigned paths:", *paths, sep="\n", flush=True)
          raise SystemExit(pytest.main([
              "-n", "4", "-v", "--tb=short",
              "--junitxml=test-results.xml", "--", *paths,
          ]))
          PY
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ inputs.python-version }}-${{ inputs.batch }}
          path: test-results.xml
          if-no-files-found: warn
