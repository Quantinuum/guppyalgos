name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run prek run --all-files
      - name: Test CI scripts
        run: uv run pytest .github/scripts/tests -q

  discover-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      batches: ${{ steps.matrix.outputs.batches }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore timings from successful main CI
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: tests/test_benchmarks.json
          key: test-benchmarks-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-benchmarks-v1-
      - name: Discover test paths
        id: matrix
        run: python3 .github/scripts/discover_test_matrix.py

  tests:
    needs: discover-tests
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        batch: ${{ fromJSON(needs.discover-tests.outputs.batches) }}
    uses: ./.github/workflows/test-folder.yml
    with:
      test-paths: ${{ toJSON(matrix.batch.paths) }}
      batch: ${{ matrix.batch.batch }}
      python-version: ${{ matrix.python-version }}

  test-benchmarks:
    name: Update test timings
    needs: [checks, tests, notebooks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: test-timings-*
          path: test-timings
      - run: python3 .github/scripts/test_benchmarks.py test-timings
      - uses: actions/upload-artifact@v7
        with:
          name: test-benchmarks
          path: tests/test_benchmarks.json
          if-no-files-found: error
      # Only successful main CI trains future batches; PRs only read the cache.
      - name: Save timings for future CI runs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: tests/test_benchmarks.json
          key: test-benchmarks-v1-${{ github.run_id }}-${{ github.run_attempt }}

  notebooks:
    name: Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - name: Execute notebooks sequentially
        run: uv run pytest tests/notebooks -v --tb=short

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: true
      - name: Build distributions and validate metadata
        run: |
          uv build
          uvx twine check --strict dist/*
      - name: Install and exercise the wheel outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" "$GITHUB_WORKSPACE/.github/scripts/smoke_test_package.py"

  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [checks, discover-tests, tests, test-benchmarks, notebooks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] != "success"}
          if failed:
              print(f"Required jobs did not succeed: {failed}")
              sys.exit(1)
          PYTHON
