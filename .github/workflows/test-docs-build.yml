name: Test sphinx docs build

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  test:
    name: Test sphinx docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: "3.13"
          enable-cache: true
      - name: Install TeX dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-pictures pdf2svg
      - run: uv sync --all-extras
      - run: uv run sphinx-build -W --keep-going docs docs/_build/html
        env:
          PYTHONPATH: ${{ github.workspace }}
